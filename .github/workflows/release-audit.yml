name: Immutable release audit

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to audit
        required: true
        type: string
      expected_commit:
        description: Expected annotated-tag commit target
        required: true
        type: string
      asset_name:
        description: Release asset filename
        required: true
        type: string

permissions:
  contents: read

jobs:
  audit:
    name: immutable-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Audit immutable release and asset digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/audit-release.sh "${{ inputs.tag }}" "${{ inputs.expected_commit }}" "${{ inputs.asset_name }}"
